name: example
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  dio: ^5.9.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  device_info_plus: ^11.0.0
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  flutter_dotenv: ^6.0.1
  firebase_auth: ^6.5.2

  # PDF Receipt
  pdf: ^3.10.4
  printing: ^5.11.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/flag.png
    - assets/emblem.png
    - assets/punkalasa.png
    - assets/icon/app_icon.png
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"